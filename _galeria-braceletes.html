<!doctype html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Galeria de conferência — Braceletes</title>
<style>
  body{ font-family: system-ui, sans-serif; background:#f5f0ee; margin:0; padding:24px; }
  h1{ font-size:20px; margin-bottom:4px; }
  p.sub{ color:#666; margin-top:0; margin-bottom:24px; }
  .grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap:16px; }
  .card{ background:#fff; border-radius:10px; overflow:hidden; box-shadow:0 1px 4px rgba(0,0,0,.12); }
  .card img{ width:100%; height:220px; object-fit:cover; display:block; background:#eee; }
  .card .label{ padding:8px 10px; font-size:13px; font-weight:600; text-align:center; }
</style>
</head>
<body>
<h1>Fotos de braceletes (fotos/bra-*.jpg)</h1>
<p class="sub">Olha cada foto e me fala o código/nome do bracelete que ela é. Ex: "bra-15-1 é o Gota Cruzada".</p>
<div class="grid" id="grid"></div>
<script>
const arquivos = ["bra-01-1.jpg","bra-01-2.jpg","bra-01-3.jpg","bra-02-1.jpg","bra-02-2.jpg","bra-02-3.jpg","bra-03.jpg","bra-04.jpg","bra-05.jpg","bra-06-1.jpg","bra-06-2.jpg","bra-07.jpg","bra-08-1.jpg","bra-08-2.jpg","bra-09-1.jpg","bra-09-2.jpg","bra-09-3.jpg","bra-10-1.jpg","bra-10-2.jpg","bra-10-3.jpg","bra-11-1.jpg","bra-11-2.jpg","bra-12-1.jpg","bra-12-2.jpg","bra-13-1.jpg","bra-13-2.jpg","bra-14-1.jpg","bra-14-2.jpg","bra-15-1.jpg","bra-15-2.jpg","bra-16-1.jpg","bra-16-2.jpg","bra-17.jpg"];
document.getElementById('grid').innerHTML = arquivos.map(f => `
  <div class="card">
    <img src="fotos/${f}" alt="${f}" loading="lazy">
    <div class="label">${f}</div>
  </div>
`).join('');
</script>
</body>
</html>
